services:
  frontend:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Read by the browser, not this container, so it has to be an
      # address the HOST machine can reach — the backend's docker-compose
      # publishes Nginx on :8080 (see ../backend/README.md §3). Override in
      # .env (see .env.example) if your backend runs elsewhere, e.g. bare
      # `uvicorn` on :8000 instead of the full Docker stack.
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
    volumes:
      # Bind-mount the source for hot reload, but keep node_modules/.next
      # as container-only volumes so the host bind mount doesn't shadow
      # what `npm ci` installed inside the image.
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next

volumes:
  frontend_node_modules:
  frontend_next_cache:
