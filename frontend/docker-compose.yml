services:
  frontend:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* variables get inlined into the client JS at `next
        # build` time (inside the Dockerfile's `RUN npm run build`) — they
        # are NOT read from the running container's environment, so this
        # has to be a build arg, not a service-level `environment:` entry.
        # An earlier version of this file only set it under `environment:`,
        # which does nothing for code already compiled into the bundle: the
        # ARG in the Dockerfile silently defaulted to empty, and every
        # request fell back to src/lib/config.ts's http://localhost:8000/api/v1
        # default instead.
        #
        # Reachable at :8080 because the backend's docker-compose stack
        # only publishes the API through Nginx (see ../backend/README.md
        # §3) — the `web` container itself isn't exposed to the host.
        # Override this by creating a real `frontend/.env` file (NOT
        # .env.local — Compose only does variable substitution from `.env`
        # or `--env-file`; `.env.local` is a Next.js-only convention that
        # only `next dev`/`next build` run directly pick up) if your
        # backend runs some other way, e.g. bare `uvicorn` on :8000.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
    ports:
      - "3000:3000"
    # No bind mount / volumes here on purpose: this container runs
    # `npm run start` against the build baked into the image at
    # `docker build` time, not `next dev`. A source bind mount wouldn't
    # do anything useful (next start doesn't watch files), and a named
    # volume over .next or node_modules would persist across rebuilds —
    # so a build that fails once (or ran before .next existed) leaves a
    # stale/empty volume that keeps shadowing every later successful
    # build's output, exactly like the bug that motivated this comment.
    # Run `docker compose up -d --build` to pick up code changes.
