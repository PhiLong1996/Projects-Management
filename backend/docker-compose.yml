services:
  web:
    build: .
    command: uvicorn src.app:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips='*'
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/taskdb
      # mailpit is this Compose network's DNS name for the mail service
      # below — not reachable as "mailpit" from the host machine, only
      # from inside another container (same as DATABASE_URL's "db" above).
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_USE_TLS=false
      # Fan-out layer for realtime notification delivery (WebSocket) — see
      # src/core/realtime.py. Same "internal DNS name only" note as above.
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./src:/app/src
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    ports:
      # Host 8080, not 80: on Windows, port 80 is frequently already
      # claimed (IIS, Skype, other services) or sits in a range Windows
      # reserves and refuses non-admin binds for ("Ports are not
      # available ... forbidden by its access permissions"). 8080 avoids
      # that entirely without needing an elevated Docker/Windows setup.
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web

  mailpit:
    # Self-hosted, no-auth dev SMTP relay: accepts any mail on 1025 with no
    # login required, and shows what was "sent" in a web UI on 8025
    # (http://localhost:8025) instead of actually delivering anywhere.
    # Nothing leaves your machine — ideal for testing forgot-password
    # emails without a real mail provider account.
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI — view captured emails here
      - "1025:1025" # SMTP — also reachable as localhost:1025 outside Docker

  redis:
    # Fan-out layer for realtime notification delivery: every `web`
    # instance publishes new notifications here and subscribes to hear
    # about ones published by the others, so a WebSocket connected to any
    # one instance still gets pushed to (see src/core/realtime.py). Not
    # used for anything else (no caching, no Celery/task-queue use here).
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=taskdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
