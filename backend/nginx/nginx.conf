events {}

http {
    upstream fastapi_backend {
        server web:8001;
    }

    # Standard Nginx WebSocket-proxying idiom: send "Connection: upgrade"
    # only when the client actually asked to upgrade ($http_upgrade set),
    # "Connection: close" otherwise — a hardcoded "upgrade" would break
    # keep-alive on every ordinary HTTP request.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Task attachments accept up to MAX_FILE_SIZE_BYTES (10 MB, see
    # src/config.py). Nginx's own default (1 MB) would reject the upload
    # with a 413 before it ever reaches the API, so this has to be at
    # least that large.
    client_max_body_size 12m;

    server {
        listen 80;

        location / {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Required for /api/v1/notifications/ws (see src/core/realtime.py)
            # to work through this proxy at all: without these two headers,
            # Nginx treats the WebSocket handshake as a plain HTTP request
            # and it never upgrades — $http_upgrade is empty/"close" for a
            # normal request, so this has no effect on non-WebSocket routes.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Keep connections open long enough for slow requests (large
            # attachment uploads/downloads, CSV report export) instead of
            # Nginx cutting them off early. A WebSocket connection is
            # long-lived by nature, so this also caps how long an idle
            # notifications socket can stay open before Nginx drops it —
            # raised well past the default for that reason.
            proxy_read_timeout 3600s;
            proxy_send_timeout 60s;
        }
    }
}
