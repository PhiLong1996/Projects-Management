events {}

http {
    upstream fastapi_backend {
        server web:8000;
    }

    # Task attachments accept up to MAX_FILE_SIZE_BYTES (10 MB, see
    # src/config.py). Nginx's own default (1 MB) would reject the upload
    # with a 413 before it ever reaches the API, so this has to be at
    # least that large.
    client_max_body_size 12m;

    server {
        listen 80;

        location / {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Keep connections open long enough for slow requests (large
            # attachment uploads/downloads, CSV report export) instead of
            # Nginx cutting them off early.
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
